name: Build wasm & deploy demo

# 从源码编译 WebAssembly、跑一遍引擎测试，然后把 web/dist 发布到 GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # emsdk 装一次很大（~700MB），缓存起来，后续构建就快了
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-6.0.12

      - name: Install emsdk
        run: |
          set -e
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install 6.0.12
          ./emsdk activate 6.0.12

      # 参数与 web/build_web.bat 保持一致（必须 -O1，见 README 第七节）
      - name: Build wasm
        run: |
          set -e
          source "$HOME/emsdk/emsdk_env.sh"
          em++ --version
          em++ -O1 -std=c++17 -I src \
            src/Types.cpp src/CardDatabase.cpp src/Room.cpp src/CardEffects.cpp src/AiAgent.cpp \
            web/wasm_api.cpp \
            --preload-file data/standard_cards.csv@data/standard_cards.csv \
            --no-entry \
            -sASYNCIFY=1 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createSgsModule \
            -sENVIRONMENT=web,node \
            -sSTACK_SIZE=1048576 \
            -o web/dist/sgs.js
          ls -l web/dist

      - name: Build & regress the desktop version
        run: |
          set -e
          g++ -std=c++17 -O2 -Isrc -o /tmp/sgs1v1 \
            src/Types.cpp src/CardDatabase.cpp src/Room.cpp src/CardEffects.cpp \
            src/AiAgent.cpp src/ConsoleAgent.cpp src/main.cpp
          /tmp/sgs1v1 --games 100 --seed 7 --quiet > /tmp/regress.txt 2>&1
          tail -6 /tmp/regress.txt
          # 内核自带的"牌数守恒"检查：任何效果把牌吃掉都会打这行告警，这里直接判失败
          if grep -q '牌数守恒检查失败' /tmp/regress.txt; then
            echo "::error::有牌被效果吃掉了，见上面的告警行"
            exit 1
          fi

      # 注意：这里不用 enablement:true —— GITHUB_TOKEN 没有权限通过 REST API
      # 创建 Pages 站点（会报 "Resource not accessible by integration"）。
      # 首次需要在仓库里手动开一次（只需一次）：
      #   Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
